<div class="flex h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r 
    border-gray-200 flex flex-col dark:bg-gray-900 dark:border-gray-800
    fixed inset-y-0 -left-64 z-30 transition-[left] duration-300 md:static" [class.-left-64]="!isSidebarOpen()"
    [class.left-0]="isSidebarOpen()">
    <div class="flex p-4 border-b border-gray-200 dark:border-gray-800 gap-2 items-center">

      <!-- back button -->
      <button (click)="toggleSidebar()"
        class="md:hidden flex-none p-2 -ml-2 rounded-lg text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
      </button>

      <app-note-search class="flex-1"></app-note-search>
    </div>

    <nav class="flex-1 p-2">
      <p class="text-xs text-gray-600 uppercase tracking-wider px-2 mb-2 dark:text-gray-400">Notebooks</p>
    </nav>

    <div class="p-3 border-b border-gray-200 dark:border-gray-800">

      <!-- Settings button -->
      <button
        class="flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 text-sm cursor-pointer
      rounded-lg hover:bg-gray-200 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
        routerLink="/settings">
        Settings
      </button>
    </div>
  </aside>

  @if (isSidebarOpen()) {
  <div (click)="toggleSidebar()" class="fixed inset-0 bg-black/30 dark:bg-black/50 md:hidden"></div>
  }

  <!-- Main area -->
  <main class="flex-1 flex h-full">
    <!-- Note list -->
    <div
      class="w-full flex flex-col md:w-80 md:flex border-r border-gray-200 bg-white h-full overflow-y-auto dark:bg-gray-900 dark:border-gray-800"
      [class.hidden]="notesService.selectedNote()">

      <!-- Antet Mobil (Centrat) -->

      <div class="flex justify-between items-center p-4 border-b border-gray-200 
        dark:border-gray-800 md:hidden bg-gray-50 dark:bg-gray-900/50">

        <!-- Burger button-->
        <button (click)="toggleSidebar()"
          class="p-2 -ml-2 text-gray-500 rounded-lg hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 cursor-pointer">
          <svg fill=" none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

        <div class="text-sm font-semibold tracking-wide uppercase text-gray-500 dark:text-gray-400">Zen Journal</div>
        <app-note-search [mode]="'icon'"></app-note-search>
      </div>
      <app-note-list class=" h-full flex flex-col" />
      <button (click)="addNote()"
        class="fixed bottom-6 right-6 z-10 w-14 h-14 bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-transform flex items-center justify-center md:hidden cursor-pointer">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg></button>
    </div>

    <!-- Editor area -->
    <div [class.hidden]="!notesService.selectedNote()" [class.flex]="notesService.selectedNote()"
      class="w-full md:flex-1 md:flex flex-col h-full dark:bg-gray-950 bg-white">
      <app-note-editor class="h-full flex flex-col" />
    </div>
  </main>
</div>
