<div class="flex h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col dark:bg-gray-900 dark:border-gray-800">
    <div class="p-4 border-b border-gray-200 dark:border-gray-800">
      <app-note-search></app-note-search>
    </div>

    <div class="p-3 border-b border-gray-200 dark:border-gray-800">
      <button
        class="flex items-center gap-2 px-4 py-2 bg-gray-700 text-white text-sm rounded-lg hover:bg-gray-600 transition-colors dark:bg-gray-800 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
        (click)="addNote()"> + Notă nouă
      </button>
    </div>

    <nav class="flex-1 p-2">
      <p class="text-xs text-gray-400 uppercase tracking-wider px-2 mb-2 dark:text-gray-500">Notebooks</p>
    </nav>

    <div class="p-3 border-b border-gray-200 dark:border-gray-800">
      <button
        class="flex items-center gap-2 px-4 py-2 bg-gray-700 text-white text-sm cursor-pointer
      rounded-lg hover:bg-gray-600 transition-colors dark:bg-gray-800 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
        routerLink="/settings">
        Settings
      </button>
    </div>
  </aside>

  <!-- Main area -->
  <main class="flex-1 flex h-full">
    <!-- Note list -->
    <div
      class="w-80 border-r border-gray-200 bg-white flex flex-col h-full overflow-y-auto dark:bg-gray-900 dark:border-gray-800">
      <app-note-list class="h-full flex flex-col" />
    </div>

    <!-- Editor area -->
    <div class="flex-1 flex flex-col h-full dark:bg-gray-950">
      <app-note-editor class="h-full flex flex-col" />
    </div>
  </main>
</div>
