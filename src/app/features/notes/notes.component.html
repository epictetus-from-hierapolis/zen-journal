<div class="w-full overflow-hidden flex h-full bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r 
    border-gray-200 flex flex-col dark:bg-gray-900 dark:border-gray-800
    fixed inset-y-0 -left-64 z-30 transition-[left] duration-300 md:static" [class.-left-64]="!isSidebarOpen()"
    [class.left-0]="isSidebarOpen()">

    <!-- back button -->
    <button (click)="toggleSidebar()"
      class="md:hidden self-start flex-none p-2 ml-4 mt-4 rounded-lg text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </button>

    <div class="flex flex-col p-4 gap-2 items-center w-full border-b border-gray-100 
    dark:border-b dark:border-gray-800">

      <!-- search button -->
      <button
        class="flex w-full items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 text-sm cursor-pointer
      rounded-lg hover:bg-gray-200 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
        (click)="openSearch()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 flex-shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <span>Search</span>
      </button>

      <div class="flex w-full gap-2">
        <!-- open new note modal button -->
        <button
          class="flex flex-1 items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 text-sm cursor-pointer
      rounded-lg hover:bg-gray-200 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
          (click)="workspaceFacadeService.addNote()">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Note</span>
        </button>

        <!-- open new notebook modal button -->
        <button (click)="openNotebookCreate()"
          class="flex flex-1 items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 text-sm cursor-pointer
      rounded-lg hover:bg-gray-200 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:border dark:border-gray-700">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Notebook</span>
        </button>
      </div>
    </div>

    <nav class="flex-1 p-2 pt-0">

      <!-- Notebooks button -->
      <div (click)="isNotebooksExpanded.set(!isNotebooksExpanded())"
        class="flex cursor-pointer justify-between items-center py-2 px-3 mb-2 mt-4 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800"
        [class.font-medium]="isNotebooksExpanded()">
        <div class="flex gap-2 items-center">
          @if (isNotebooksExpanded()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-4 h-4 flex-shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 0 0-1.883 2.542l.857 6a2.25 2.25 0 0 0 2.227 1.932H19.05a2.25 2.25 0 0 0 2.227-1.932l.857-6a2.25 2.25 0 0 0-1.883-2.542m-16.5 0V6A2.25 2.25 0 0 1 6 3.75h3.879a1.5 1.5 0 0 1 1.06.44l2.122 2.12a1.5 1.5 0 0 0 1.06.44H18A2.25 2.25 0 0 1 20.25 9v.776" />
          </svg>
          } @else {
          <svg xmlns=" http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-4 h-4 text-gray-400 flex-shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
          </svg>
          }
          <span class="text-xs text-gray-600 uppercase tracking-wider dark:text-gray-300">Notebooks</span>
        </div>
      </div>

      @if (isNotebooksExpanded()) {
      <app-notebooks [notebooks]="workspaceFacadeService.notebooks()"
        [selectedNotebook]="workspaceFacadeService.selectedNotebook()" (notebookSelected)="selectNotebook($event)" />
      }

    </nav>

    <div class="p-3 flex justify-between items-center border-t border-gray-200 dark:border-gray-800">
      <div>Welcome, {{appSettingsService.username()}}</div>

      <!-- Settings button -->
      <button
        class="flex  px-4 py-2 bg-gray-100 text-gray-700 text-sm cursor-pointer
      rounded-lg hover:bg-gray-200 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
        routerLink="/settings">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>

      </button>
    </div>
  </aside>

  @if (isSidebarOpen()) {
  <!-- backdrop -->
  <div (click)="toggleSidebar()" class="fixed z-10 inset-0 bg-black/30 dark:bg-black/50 md:hidden"></div>
  }

  <!-- Main area -->
  <main class="flex-1 flex h-full min-w-0">

    <!-- Note list -->
    <div class="flex flex-col md:w-80 md:flex bg-white h-full overflow-hidden dark:bg-gray-900 pl-2"
      [class.w-full]="!workspaceFacadeService.selectedNote()" [class.w-0]="workspaceFacadeService.selectedNote()">
      <!-- Antet Mobil (Centrat) -->

      <div class="flex justify-between items-center p-4 border-b border-gray-200 
        dark:border-gray-800 md:hidden bg-gray-50 dark:bg-gray-900/50">

        <!-- Burger button-->
        <button (click)="toggleSidebar()"
          class="p-2 -ml-2 text-gray-500 rounded-lg hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 cursor-pointer">
          <svg fill=" none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

        <h1 class="text-sm font-semibold tracking-wide uppercase 
        text-gray-500 dark:text-gray-400">Zen Journal</h1>
        <button (click)="openSearch()" class="p-2 -mr-2 text-gray-600 rounded-lg 
    hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 
    cursor-pointer">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 flex-shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </button>
      </div>
      <app-note-list [notebooksCount]="workspaceFacadeService.notebooksCount()"
        [notes]="workspaceFacadeService.visibleNotes()" [selectedNotebook]="workspaceFacadeService.selectedNotebook()"
        [selectedNote]="workspaceFacadeService.selectedNote()"
        (noteSelected)="workspaceFacadeService.selectNote($event)" [savedStatus]="workspaceFacadeService.saveStatus()"
        (notebookRenamed)="workspaceFacadeService.updateNotebook($event.id, {name: $event.name})"
        (notebookRemoved)="workspaceFacadeService.deleteNotebook($event)"
        [notesCount]="workspaceFacadeService.totalNotes()" [isLoading]="workspaceFacadeService.isLoading()"
        class=" h-full flex flex-col" />
      <button (click)="workspaceFacadeService.addNote()"
        class="fixed bottom-6 right-6 z-10 w-14 h-14 bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-transform flex items-center justify-center md:hidden cursor-pointer">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg></button>
    </div>
    @if(workspaceFacadeService.selectedNote()){
    <!-- Editor area -->
    <div class="min-w-0 w-full md:flex-1 md:flex flex-col h-full dark:bg-gray-900 bg-white p-2">
      <app-note-editor [selectedNote]="workspaceFacadeService.selectedNote()"
        [savedStatus]="workspaceFacadeService.saveStatus()"
        (noteChanged)="workspaceFacadeService.applyOptimisticUpdate($event.id, $event.changes)"
        (noteSaved)="workspaceFacadeService.updateNote($event.id, $event.changes)"
        (noteRemoved)="workspaceFacadeService.deleteNote($event)" (noteAdded)="workspaceFacadeService.addNote()"
        (noteSelected)="workspaceFacadeService.selectNote($event)"
        class="min-w-0 h-full flex flex-col dark:bg-gray-950 rounded-lg border border-gray-200 dark:border-gray-800" />
    </div>
    }
  </main>
</div>

@if(isSearchModalOpen()){
<!-- search -->
<app-note-search class="flex-1" [notes]="workspaceFacadeService.filteredNotes()"
  (queryChanged)="workspaceFacadeService.searchQuery$.next($event)"
  (noteSelected)="workspaceFacadeService.selectNote($event)" (close)="closeSearch()"></app-note-search>
}

@if(isCreateNotebookModalOpen()){
<app-notebook-create (close)="closeNotebookCreate()" (notebookAdded)="workspaceFacadeService.addNotebook($event)" />
}
