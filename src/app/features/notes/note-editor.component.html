<div class="flex flex-col h-full py-4 md:pb-4">

    @if(notesService.selectedNote()) {
    <div class="flex flex-col h-full">

        <!-- header -->
        <div class="order-1 flex items-center justify-between gap-4 mb-4 px-4">
            <!-- back and title -->
            <div class="flex items-center gap-2 flex-1">
                <button class="md:hidden p-2 -ml-2 text-gray-500 rounded-lg
                     hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 cursor-pointer"
                    (click)="notesService.selectNote(null)">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                </button>
                <input type="text" placeholder="Titlu"
                    class="w-full text-xl font-medium bg-transparent border-none outline-none text-gray-900 dark:text-gray-100 dark:placeholder-gray-600"
                    [value]="notesService.selectedNote()?.title ?? ''" (input)="onInputChange($event)" />
            </div>

            <!-- Word count and menu "more options"-->
            <div class="flex items-center gap-2 relative">
                <div class="text-xs text-gray-600 dark:text-gray-400">{{ notesService.selectedNote()?.content |
                    wordCount}} words
                </div>
                <button (click)="toggleMenu($event)" class="text-gray-500 rounded-lg
                     hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 cursor-pointer p-2 -mr-2">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                    </svg>
                </button>
                @if (isMenuOpen()) {
                <div
                    class="-mr-2 absolute top-10 right-0 z-10 w-44 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl py-1 overflow-hidden">
                    <button
                        class="flex items-center gap-2 w-full text-left px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors cursor-pointer"
                        (click)="deleteNote()">
                        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                        <span>Remove</span>
                    </button>
                </div>
                }
                @if(saveStatus()){
                <div class="absolute top-full text-xs -mt-2 text-gray-600 dark:text-gray-400">
                    {{saveStatus()}}
                </div>
                }
            </div>
        </div>

        <!-- Toolbar -->
        <div class=" order-3 md:order-2 flex items-center gap-1.5 w-full bg-gray-50 border-t border-b md:mb-4 md:mt-0
                    mt-4 border-gray-200 dark:border-gray-800 dark:bg-gray-900 p-1">
            <!-- Buton BOLD -->
            <button (click)="editor.chain().focus().toggleBold().run()" [class.bg-gray-200]="editor.isActive('bold')"
                [class.dark:bg-gray-700]="editor.isActive('bold')"
                class="font-semibold text-sm w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                <strong>B</strong>
            </button>
            <!-- Buton ITALIC -->
            <button (click)="editor.chain().focus().toggleItalic().run()"
                [class.bg-gray-200]="editor.isActive('italic')" [class.dark:bg-gray-700]="editor.isActive('italic')"
                class="font-semibold text-sm w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                <em>i</em>
            </button>
            <!-- Separator -->
            <div class="h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>
            <!-- Buton HEADING 1 (H1) -->
            <button (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()"
                [class.bg-gray-200]="editor.isActive('heading', {level: 1})"
                [class.dark:bg-gray-700]="editor.isActive('heading', {level: 1})" class="w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors 
                cursor-pointer text-gray-700 dark:text-gray-300 font-semibold text-sm">
                <strong>H1</strong>
            </button>
            <!-- Buton HEADING 2 (H2) -->
            <button (click)="editor.chain().focus().toggleHeading({ level: 2 }).run()"
                [class.bg-gray-200]="editor.isActive('heading', {level: 2})"
                [class.dark:bg-gray-700]="editor.isActive('heading', {level: 2})" class="w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors 
                cursor-pointer text-gray-700 dark:text-gray-300 font-semibold text-sm">
                <strong>H2</strong>
            </button>
            <!-- Separator -->
            <div class="h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>
            <!-- Buton BULLET LIST -->
            <button (click)="editor.chain().focus().toggleBulletList().run()"
                [class.bg-gray-200]="editor.isActive('bulletList')"
                [class.dark:bg-gray-700]="editor.isActive('bulletList')"
                class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
                </svg>
            </button>
        </div>

        <tiptap-editor [editor]="editor" class="order-2 md:order-3 flex-1 bg-transparent border-none text-gray-700 leading-relaxed 
            dark:text-gray-300 px-4 dark:placeholder-gray-600 overflow-y-auto break-words"></tiptap-editor>


    </div>
    } @else {
    <div class="flex flex-col items-center justify-center h-full gap-4">
        <p class="text-sm text-gray-400 dark:text-gray-500">Selecteaza o nota sau creeaza una noua</p>
        <button
            class="px-4 py-2 bg-gray-900 text-white text-sm rounded-lg hover:bg-gray-700 transition-colors dark:bg-gray-800 dark:hover:bg-gray-700 dark:border dark:border-gray-700"
            (click)="addTestNote()">+ Nota noua</button>
    </div>
    }
</div>
