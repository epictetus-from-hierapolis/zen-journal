<div class="h-full flex flex-col min-w-0 dark:bg-gray-950 rounded-lg border border-gray-200 dark:border-gray-800">
    <div class="flex flex-col h-full py-4 md:pb-4">
        @let currentSelectedNote = selectedNote();
        @if(currentSelectedNote) {
        <div class="flex flex-col h-full min-w-0">

            <!-- header -->
            <div class="order-1 md:order-2 flex items-center justify-between gap-4 mb-4 px-4">
                <!-- back and title -->
                <div class="flex items-center gap-2 flex-1">
                    <button class="md:hidden p-2 -ml-2 text-gray-500 rounded-lg
                     hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 cursor-pointer"
                        (click)="noteSelected.emit(null)">
                        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                        </svg>
                    </button>
                    <input type="text" placeholder="Title"
                        class="w-full text-xl md:pl-8 font-medium bg-transparent border-none outline-none text-gray-900 dark:text-gray-100 dark:placeholder-gray-600"
                        [value]="currentSelectedNote.title" (input)="onTitleChange($event)" />
                </div>

                <!-- Word count and menu "more options"-->
                <div class="flex items-center gap-2 relative">
                    <div class="text-xs text-gray-600 dark:text-gray-400">{{
                        currentSelectedNote.content
                        |
                        wordCount}} words
                    </div>
                    <button (click)="toggleMenu($event)" class="text-gray-500 rounded-lg
                     hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 cursor-pointer p-2 -mr-2">
                        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                        </svg>
                    </button>
                    @let currentSavedStatus = saveStatus();
                    @if (isMenuOpen()) {
                    <div
                        class="-mr-2 absolute top-10 right-0 z-10 w-44 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl py-1 overflow-hidden">
                        <button
                            class="flex items-center gap-2 w-full text-left px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors cursor-pointer"
                            (click)="onNoteRemove()">
                            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                class="size-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                            </svg>
                            <span>Remove</span>
                        </button>
                    </div>
                    }
                    @if(currentSavedStatus){
                    <div class="absolute top-full text-xs -mt-2 text-gray-600 dark:text-gray-400">
                        {{currentSavedStatus}}
                    </div>
                    }
                </div>
            </div>

            <!-- Toolbar -->
            <div (wheel)="onWheelScroll($event)"
                class="order-3 md:order-1 flex items-center gap-1.5 w-full md:mb-4 md:mt-0 mt-4 p-1 overflow-x-auto flex-nowrap whitespace-nowrap scrollbar-none">
                <!-- Buton UNDO -->
                <button (click)="editor.chain().focus().undo().run()"
                    [disabled]="!editor.can().undo()"
                    title="Undo"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300 disabled:opacity-30 disabled:cursor-not-allowed">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
                    </svg>
                </button>
                <!-- Buton REDO -->
                <button (click)="editor.chain().focus().redo().run()"
                    [disabled]="!editor.can().redo()"
                    title="Redo"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300 disabled:opacity-30 disabled:cursor-not-allowed">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m15 15 6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3" />
                    </svg>
                </button>
                <!-- Separator -->
                <div class="shrink-0 h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>
                
                <!-- Buton BOLD -->
                <button (click)="editor.chain().focus().toggleBold().run()"
                    [class.bg-zinc-100]="editor.isActive('bold')" [class.text-zinc-900]="editor.isActive('bold')"
                    [class.dark:bg-zinc-800]="editor.isActive('bold')" [class.dark:text-zinc-50]="editor.isActive('bold')"
                    title="Bold"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 4.5h6.75a3.75 3.75 0 0 1 0 7.5H6.75V4.5Zm0 7.5h7.5a3.75 3.75 0 0 1 0 7.5h-7.5v-7.5Z" />
                    </svg>
                </button>
                <!-- Buton ITALIC -->
                <button (click)="editor.chain().focus().toggleItalic().run()"
                    [class.bg-zinc-100]="editor.isActive('italic')" [class.text-zinc-900]="editor.isActive('italic')"
                    [class.dark:bg-zinc-800]="editor.isActive('italic')" [class.dark:text-zinc-50]="editor.isActive('italic')"
                    title="Italic"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.5 4.5h-9M14.5 19.5h-9M13.5 4.5l-3 15" />
                    </svg>
                </button>
                <!-- Buton UNDERLINE -->
                <button (click)="editor.chain().focus().toggleUnderline().run()"
                    [class.bg-zinc-100]="editor.isActive('underline')" [class.text-zinc-900]="editor.isActive('underline')"
                    [class.dark:bg-zinc-800]="editor.isActive('underline')" [class.dark:text-zinc-50]="editor.isActive('underline')"
                    title="Underline"
                    class="shrink-0 w-9 h-9 flex flex-col items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <span class="text-base font-bold leading-none z-0">U</span>
                    <div class="w-4 h-0.5 mt-px rounded-full z-0 bg-current"></div>
                </button>
                <!-- Buton STRIKETHROUGH -->
                <button (click)="editor.chain().focus().toggleStrike().run()"
                    [class.bg-zinc-100]="editor.isActive('strike')" [class.text-zinc-900]="editor.isActive('strike')"
                    [class.dark:bg-zinc-800]="editor.isActive('strike')" [class.dark:text-zinc-50]="editor.isActive('strike')"
                    title="Strikethrough"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 8.25a3.75 3.75 0 0 0-7.5 0c0 3.5 7.5 4.5 7.5 7.5a3.75 3.75 0 0 1-7.5 0M3.75 12h16.5" />
                    </svg>
                </button>
                
                 <!-- Culoare text -->
                 <button (contextmenu)="$event.preventDefault(); editor.chain().focus().unsetColor().run()"
                     title="Text Color (Right-click to reset)"
                     class="relative shrink-0 w-9 h-9 flex flex-col items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                     <input type="color" [value]="rgbToHex(editor.getAttributes('textStyle')['color'], '#000000')" (input)="onTextColorChange(textColorInput.value)" #textColorInput
                         class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" />
                     <span class="text-base font-bold leading-none z-0">A</span>
                     <div class="w-4 h-0.5 mt-0.5 rounded-full z-0" [style.background-color]="editor.getAttributes('textStyle')['color'] || 'currentColor'"></div>
                 </button>
 
                 <!-- Culoare fundal text (Highlight) -->
                 <button (contextmenu)="$event.preventDefault(); editor.chain().focus().unsetHighlight().run()"
                     title="Highlight Color (Right-click to reset)"
                     class="relative shrink-0 w-9 h-9 flex flex-col items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                     <input type="color" [value]="rgbToHex(editor.getAttributes('highlight')['color'], '#ffff00')" (input)="onBgColorChange(bgColorInput.value)" #bgColorInput
                         class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" />
                     <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5 z-0">
                         <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 3.75l1.5 1.5-10.5 10.5-2.25-.75-.75-2.25 10.5-10.5zM15 7.5l1.5 1.5" />
                     </svg>
                     <div class="w-4 h-0.5 -mt-0.5 rounded-full z-0" [style.background-color]="editor.getAttributes('highlight')['color'] || 'currentColor'"></div>
                 </button>

                <!-- Separator -->
                <div class="shrink-0 h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>

                 <!-- Dropdown pentru Font Family -->
                 <div class="relative shrink-0 flex items-center w-24" title="Font Family">
                     <select [value]="currentFontFamily" (change)="onFontFamilyChange($event)"
                         class="w-full pl-2 pr-7 py-1 h-9 text-sm rounded-lg border border-gray-200 dark:border-gray-800 bg-transparent text-gray-700 dark:text-gray-300 focus:outline-none focus:border-gray-400 dark:focus:border-gray-600 cursor-pointer appearance-none select-none">
                         <option value="" class="bg-white dark:bg-gray-900 text-gray-400">Sans</option>
                         <option value="Georgia, serif" class="bg-white dark:bg-gray-900 font-serif">Serif</option>
                         <option value="Courier New, monospace" class="bg-white dark:bg-gray-900 font-mono">Mono</option>
                         <option value="Trebuchet MS, sans-serif" class="bg-white dark:bg-gray-900">Modern</option>
                     </select>
                     <div class="absolute right-2 pointer-events-none text-gray-400 dark:text-gray-600 flex items-center justify-center">
                         <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                             <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                         </svg>
                     </div>
                 </div>
                 
                 <!-- Dropdown pentru Font Size -->
                 <div class="relative shrink-0 flex items-center w-20" title="Font Size">
                     <select [value]="currentFontSize" (change)="onFontSizeChange($event)"
                         class="w-full pl-2 pr-7 py-1 h-9 text-sm rounded-lg border border-gray-200 dark:border-gray-800 bg-transparent text-gray-700 dark:text-gray-300 focus:outline-none focus:border-gray-400 dark:focus:border-gray-600 cursor-pointer appearance-none select-none">
                         <option value="" class="bg-white dark:bg-gray-900 text-gray-400">16px</option>
                         <option value="12px" class="bg-white dark:bg-gray-900">12px</option>
                         <option value="14px" class="bg-white dark:bg-gray-900">14px</option>
                         <option value="16px" class="bg-white dark:bg-gray-900">16px</option>
                         <option value="18px" class="bg-white dark:bg-gray-900">18px</option>
                         <option value="20px" class="bg-white dark:bg-gray-900">20px</option>
                         <option value="24px" class="bg-white dark:bg-gray-900">24px</option>
                         <option value="30px" class="bg-white dark:bg-gray-900">30px</option>
                         <option value="36px" class="bg-white dark:bg-gray-900">36px</option>
                     </select>
                     <div class="absolute right-2 pointer-events-none text-gray-400 dark:text-gray-600 flex items-center justify-center">
                         <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                             <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                         </svg>
                     </div>
                 </div>
                
                <!-- Separator -->
                <div class="shrink-0 h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>
                
                <!-- Buton HEADING 1 (H1) -->
                <button (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()"
                    [class.bg-zinc-100]="editor.isActive('heading', {level: 1})" [class.text-zinc-900]="editor.isActive('heading', {level: 1})"
                    [class.dark:bg-zinc-800]="editor.isActive('heading', {level: 1})" [class.dark:text-zinc-50]="editor.isActive('heading', {level: 1})"
                    title="Heading 1"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 5v14M12 5v14M4 12h8" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 9v10M15.5 10.5 17 9" />
                    </svg>
                </button>
                <!-- Buton HEADING 2 (H2) -->
                <button (click)="editor.chain().focus().toggleHeading({ level: 2 }).run()"
                    [class.bg-zinc-100]="editor.isActive('heading', {level: 2})" [class.text-zinc-900]="editor.isActive('heading', {level: 2})"
                    [class.dark:bg-zinc-800]="editor.isActive('heading', {level: 2})" [class.dark:text-zinc-50]="editor.isActive('heading', {level: 2})"
                    title="Heading 2"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 5v14M12 5v14M4 12h8" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 11a2 2 0 0 1 4 0c0 3-4 5-4 8h4" />
                    </svg>
                </button>

                <!-- Dropdown pentru Aliniere Text -->
                <div class="relative shrink-0 flex items-center w-24" title="Text Alignment">
                    <select [value]="currentTextAlign" (change)="onTextAlignChange($event)"
                        class="w-full pl-2 pr-7 py-1 h-9 text-sm rounded-lg border border-gray-200 dark:border-gray-800 bg-transparent text-gray-700 dark:text-gray-300 focus:outline-none focus:border-gray-400 dark:focus:border-gray-600 cursor-pointer appearance-none select-none">
                        <option value="left" class="bg-white dark:bg-gray-900">Left</option>
                        <option value="center" class="bg-white dark:bg-gray-900">Center</option>
                        <option value="right" class="bg-white dark:bg-gray-900">Right</option>
                        <option value="justify" class="bg-white dark:bg-gray-900">Justify</option>
                    </select>
                    <div class="absolute right-2 pointer-events-none text-gray-400 dark:text-gray-600 flex items-center justify-center">
                        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                        </svg>
                    </div>
                </div>
                
                <!-- Separator -->
                <div class="shrink-0 h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>

                <!-- Outdent -->
                <button (click)="editor.chain().focus().outdent().run()"
                    title="Decrease Indent"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5M21 12H11" />
                    </svg>
                </button>
                <!-- Indent -->
                <button (click)="editor.chain().focus().indent().run()"
                    title="Increase Indent"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5M3 12h10" />
                    </svg>
                </button>
                
                <!-- Separator -->
                <div class="shrink-0 h-6 w-px bg-gray-200 dark:bg-gray-800 mx-1"></div>
                
                <!-- Buton BULLET LIST -->
                <button (click)="editor.chain().focus().toggleBulletList().run()"
                    [class.bg-zinc-100]="editor.isActive('bulletList')" [class.text-zinc-900]="editor.isActive('bulletList')"
                    [class.dark:bg-zinc-800]="editor.isActive('bulletList')" [class.dark:text-zinc-50]="editor.isActive('bulletList')"
                    title="Bullet List"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
                    </svg>
                </button>
                <!-- Buton LISTĂ CU NUMERE -->
                <button (click)="editor.chain().focus().toggleOrderedList().run()"
                    [class.bg-zinc-100]="editor.isActive('orderedList')" [class.text-zinc-900]="editor.isActive('orderedList')"
                    [class.dark:bg-zinc-800]="editor.isActive('orderedList')" [class.dark:text-zinc-50]="editor.isActive('orderedList')"
                    title="Numbered List"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5.75h12M9 11.5h12M9 16.5h12M4.5 2v7.5M2.5 4l2-2M2.5 9.5h4M2.5 15.5a1.75 1.75 0 0 1 3.5 0c0 2.25-3.5 3.5-3.5 3.5h3.5" />
                    </svg>
                </button>

                <!-- Buton CHECKLIST -->
                <button (click)="editor.chain().focus().toggleTaskList().run()"
                    [class.bg-zinc-100]="editor.isActive('taskList')" [class.text-zinc-900]="editor.isActive('taskList')"
                    [class.dark:bg-zinc-800]="editor.isActive('taskList')" [class.dark:text-zinc-50]="editor.isActive('taskList')"
                    title="Checklist"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                </button>
                
                <!-- Buton BLOCKQUOTE (Quote) -->
                <button (click)="editor.chain().focus().toggleBlockquote().run()"
                    [class.bg-zinc-100]="editor.isActive('blockquote')" [class.text-zinc-900]="editor.isActive('blockquote')"
                    [class.dark:bg-zinc-800]="editor.isActive('blockquote')" [class.dark:text-zinc-50]="editor.isActive('blockquote')"
                    title="Quote"
                    class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer text-gray-700 dark:text-gray-300">
                    <svg fill="currentColor" viewBox="0 0 24 24" class="size-5">
                        <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.996 3.638-3.996 5.849h3.983v10h-9.982zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z" />
                    </svg>
                </button>
            </div>

            <tiptap-editor [editor]="editor" class="order-2 md:order-3 flex-1 bg-transparent border-none text-gray-700 leading-relaxed 
            dark:text-gray-300 px-4 dark:placeholder-gray-600 overflow-y-auto break-words md:pl-12"></tiptap-editor>


        </div>
        } @else {
        <div class="flex flex-col items-center justify-center h-full gap-4">
            <p class="text-sm text-gray-400 dark:text-gray-500">Selecteaza o nota sau creeaza una noua</p>
            <button
                class="flex items-center gap-1 cursor-pointer px-4 py-2 bg-gray-900 text-white text-sm rounded-full 
        bg-gray-900 dark:bg-white dark:text-gray-900 font-medium hover:bg-gray-700 dark:hover:bg-gray-200 transition-colors"
                (click)="noteAdded.emit()">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
