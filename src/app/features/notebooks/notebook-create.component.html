<button (click)="onOpen()" class="p-1 rounded-full text-gray-500 hover:bg-gray-100 
    hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 border
    dark:hover:text-white transition-colors duration-200 cursor-pointer flex items-center justify-center">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
</button>

@if (isOpen()) {
<app-modal (cancel)="onCancel()" (confirm)="onConfirm()" title="Create new notebook" confirmLabel="Create"
    [confirmDisabled]="!notebookName().trim()">
    <div>
        <input [value]="notebookName()" (input)="onNameChange($event)" name="notebookName" type="text"
            placeholder="Insert notebook name" class="w-full px-3 py-2 text-sm dark:text-white dark:bg-gray-800 border 
                border-gray-200 dark:border-gray-700 rounded-lg outline-none 
                focus:border-gray-400 dark:focus:border-gray-500 transition-colors" />
    </div>
</app-modal>
}
