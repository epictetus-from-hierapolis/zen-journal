<button (click)="onOpen()" class="p-2 -mr-2 rounded-full text-gray-500 hover:bg-gray-100 
    hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 
    dark:hover:text-white transition-colors duration-200 cursor-pointer flex items-center justify-center">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
</button>

@if (isOpen()) {
<div class="flex fixed inset-0 bg-black/50 z-50 items-center justify-center dark:bg-black/70">
    <div class="w-full h-full bg-white p-4 
        md:rounded-xl md:shadow-2x1 md:w-1/2 md:max-w-2xl md:h-[600px] 
        flex flex-col dark:bg-gray-900 dark:shadow-none">
        <form class="flex gap-4 flex-col" (ngSubmit)="onCreate()">
            <h1 class="text-lg font-semibold text-gray-900 dark:text-white">Create new notebook</h1>
            <div>
                <input [value]="notebookName()" (input)="onInputChange($event)" name="notebookName" type="text"
                    placeholder="Insert notebook name" class="w-full px-3 py-2 text-sm dark:text-white dark:bg-gray-800 border 
                border-gray-200 dark:border-gray-700 rounded-lg outline-none 
                focus:border-gray-400 dark:focus:border-gray-500 transition-colors" />
            </div>


            <div class="flex gap-4 justify-end">
                <button (click)="onCancel()"
                    class="px-4 py-2 bg-gray-100 text-gray-700 text-sm cursor-pointer rounded-lg hover:bg-gray-200 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:border dark:border-gray-700">
                    <span>Cancel</span>
                </button>
                <button [disabled]="!notebookName().trim()" type="submit"
                    class="px-4 py-2 bg-gray-900 shadow-sm dark:bg-white dark:text-gray-900 text-white text-sm rounded-lg cursor-pointer hover:bg-gray-700 dark:hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>Create</span>
                </button>
            </div>

        </form>
    </div>
</div>
}
