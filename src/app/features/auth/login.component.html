<div class="flex justify-center items-center h-screen  w-full bg-gray-50">
    <form class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm flex flex-col gap-4" [formGroup]="loginForm"
        (ngSubmit)="onSubmit()">

        <h1 class="text-xl font-semibold text-gray-900">Zen Journal</h1>

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600" for="username">Username</label>
            <input
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-gray-400 transition-colors"
                id="username" type="text" formControlName="username" />
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600" for="password">Password</label>
            <input
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-gray-400 transition-colors"
                id="password" type="password" formControlName="password" />
        </div>

        @if (errorMessage()) {
        <p class="text-red-500 text-sm">{{errorMessage()}}</p>
        }
        <button
            class="w-full px-4 py-2 bg-gray-900 text-white text-sm rounded-lg hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            type="submit" [disabled]="loginForm.invalid"
            [attr.disabled]="loginForm.invalid ? true : null">Login</button>

    </form>
</div>
