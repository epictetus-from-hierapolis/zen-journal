<div class="flex justify-center items-center h-screen  w-full bg-gray-50 dark:bg-gray-950">
    <form class="bg-white dark:bg-gray-900 p-8 rounded-xl shadow-lg w-full max-w-sm flex flex-col gap-4"
        [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <h1 class="text-xl font-semibold text-gray-900 dark:text-white">Zen Journal</h1>

        <div class="flex flex-col gap-1">
            <input class="autofill:bg-gray-800 dark:autofill:bg-gray-800 w-full px-3 py-2 text-sm dark:text-white dark:bg-gray-800 border 
                border-gray-200 dark:border-gray-700 rounded-lg outline-none 
                focus:border-gray-400 dark:focus:border-gray-500 transition-colors" id="username" type="text"
                formControlName="username" placeholder="Username" />
        </div>

        <div class="flex flex-col gap-1">
            <input class="w-full px-3 py-2 text-sm dark:text-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 
                rounded-lg outline-none focus:border-gray-400 dark:focus:border-gray-500 transition-colors"
                id="password" type="password" formControlName="password" placeholder="Password" />
        </div>

        <button
            class="cursor-pointer w-full px-4 py-2 bg-gray-900 shadow-sm dark:bg-white dark:text-gray-900 text-white text-sm rounded-lg hover:bg-gray-700 dark:hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            type="submit" [disabled]="loginForm.invalid"
            [attr.disabled]="loginForm.invalid ? true : null">Login</button>

        @if (errorMessage()) {
        <p class=" text-red-500 dark:text-red-400 text-sm text-center font-medium">{{ errorMessage() }}
        </p>
        }

    </form>
</div>
